name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and generate changelog
        id: bump
        uses: cocogitto/cocogitto-action@v4
        with:
          command: bump
          args: --auto
          git-user: "github-actions[bot]"
          git-user-email: "github-actions[bot]@users.noreply.github.com"

      - name: Push bump commit and tag
        if: steps.bump.outputs.version != ''
        run: |
          git push origin main --follow-tags
          git checkout develop
          git pull origin develop
          git merge main --no-edit -X theirs
          git push origin develop

      - uses: oven-sh/setup-bun@v2
        if: steps.bump.outputs.version != ''
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.bump.outputs.version != ''
        run: bun install

      - name: Build
        if: steps.bump.outputs.version != ''
        run: bun nx run arteflix:all:build

      - name: Extract changelog for release
        if: steps.bump.outputs.version != ''
        id: changelog
        run: cog changelog --at ${{ steps.bump.outputs.version }} > /tmp/release_notes.md

      - name: Create GitHub Release
        if: steps.bump.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.version }}
          name: Release ${{ steps.bump.outputs.version }}
          body_path: /tmp/release_notes.md
          make_latest: true

      - name: Deploy proxy worker
        if: steps.bump.outputs.version != ''
        run: bun nx run arteflix-proxy:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify proxy online
        if: steps.bump.outputs.version != ''
        run: bun nx run arteflix-proxy:verify
